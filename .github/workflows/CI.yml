name: CI

on:
  push:
    branches: [ "v4" ]
  pull_request:
    branches: [ "v4" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build_configuration: [debug, release]
        architecture: [x64, x86]
    env:
      BUILD_DIR: Build/${{ matrix.build_configuration == 'debug' && 'Debug' || 'Release' }}/${{ matrix.architecture }}
      VULKAN_SDK: ${{ github.workspace }}\Vulkan-Headers
    defaults:
      run:
        working-directory: OmegaWare-Framework

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        path: OmegaWare-Framework
        submodules: recursive
        token: ${{ secrets.OMEGAWARE_REPOSITORIES_TOKEN || github.token }}

    - name: Checkout Vulkan Headers
      uses: actions/checkout@v4
      with:
        repository: KhronosGroup/Vulkan-Headers
        ref: vulkan-sdk-1.4.350.0
        path: Vulkan-Headers

    - name: Install XMake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Configure XMake
      run: |
        xmake f -p windows -m ${{ matrix.build_configuration }} -a ${{ matrix.architecture }} --proxy=version -y

    - name: Build with XMake
      run: |
        xmake build

    - name: Test (version.dll proxy)
      run: |
        & "$env:BUILD_DIR/OmegaWareTests/OmegaWareTests.exe"
        exit $LASTEXITCODE

    - name: Build and Test Other Proxies
      run: |
        foreach ($strProxy in @("winmm", "dinput8")) {
          xmake f -p windows -m ${{ matrix.build_configuration }} -a ${{ matrix.architecture }} --proxy=$strProxy -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake build OmegaWareProxy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake build OmegaWareTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:BUILD_DIR/OmegaWareTests/OmegaWareTests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OmegaWare-${{ matrix.build_configuration }}-${{ matrix.architecture }}
        path: |
          OmegaWare-Framework/${{ env.BUILD_DIR }}/OmegaWare/OmegaWare.dll
          OmegaWare-Framework/${{ env.BUILD_DIR }}/OmegaWareProxy/*.dll
        if-no-files-found: error
