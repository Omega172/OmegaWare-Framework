name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build_configuration: [debug, release]
        architecture: [x64]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install XMake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Configure XMake
      run: |
        xmake f -m ${{ matrix.build_configuration }} -a ${{ matrix.architecture }} -y

    - name: Build with XMake
      run: |
        xmake build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.build_configuration }}
        path: |
          Build/${{ matrix.build_configuration == 'debug' && 'Debug' || 'Release' }}/Internal/Internal.dll
          Build/${{ matrix.build_configuration == 'debug' && 'Debug' || 'Release' }}/Proxy/version.dll
