name: Release Build

on:
  release:
    types: [created, published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build_configuration: [release]
        architecture: [x64]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install XMake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Configure XMake
      run: |
        xmake f -m ${{ matrix.build_configuration }} -a ${{ matrix.architecture }} -y

    - name: Build with XMake
      run: |
        xmake build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OmegaWare-${{ matrix.build_configuration }}-${{ matrix.architecture }}
        path: |
          Build/Release/Internal/Internal.dll
          Build/Release/Proxy/version.dll

    - name: Create Release Archive
      run: |
        Compress-Archive -Path Build/Release/Internal/Internal.dll,Build/Release/Proxy/version.dll -DestinationPath OmegaWare-${{ matrix.build_configuration }}-${{ matrix.architecture }}.zip

    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: OmegaWare-${{ matrix.build_configuration }}-${{ matrix.architecture }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
